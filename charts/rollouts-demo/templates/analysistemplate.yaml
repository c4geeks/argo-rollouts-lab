{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "rollouts-demo.fullname" . }}-success-rate
  labels:
    {{- include "rollouts-demo.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-service
  metrics:
    - name: success-rate
      interval: {{ .Values.analysis.interval }}
      count: {{ .Values.analysis.count }}
      initialDelay: {{ .Values.analysis.initialDelay }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: len(result) == 0 || result[0] >= {{ .Values.analysis.successRateThreshold }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            1 - (
              (sum(rate(demo_http_requests_total{service="{{ "{{args.canary-service}}" }}",code=~"5.."}[30s])) or vector(0))
              /
              clamp_min(sum(rate(demo_http_requests_total{service="{{ "{{args.canary-service}}" }}"}[30s])), 1)
            )
    - name: p95-latency
      interval: {{ .Values.analysis.interval }}
      count: {{ .Values.analysis.count }}
      initialDelay: {{ .Values.analysis.initialDelay }}
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] <= {{ .Values.analysis.p95LatencySeconds }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95,
              sum(rate(demo_http_request_duration_seconds_bucket{service="{{ "{{args.canary-service}}" }}"}[30s]))
              by (le))
{{- end }}
